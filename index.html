    <!-- Instant Client-Side Favicon Renderer (Guarantees fresh round PNG favicon across all browsers) -->
    <script type="text/javascript">
      (function() {
        function renderLiveFavicon() {
          try {
            var img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
              var canvas = document.createElement('canvas');
              canvas.width = 64;
              canvas.height = 64;
              var ctx = canvas.getContext('2d');
              if (!ctx) return;
              ctx.beginPath();
              ctx.arc(32, 32, 31, 0, Math.PI * 2);
              ctx.closePath();
              ctx.clip();
              ctx.drawImage(img, 0, 0, 64, 64);
              var pngUrl = canvas.toDataURL('image/png');
              
              var oldIcons = document.querySelectorAll("link[rel*='icon']");
              for (var i = 0; i < oldIcons.length; i++) {
                if (oldIcons[i].parentNode) oldIcons[i].parentNode.removeChild(oldIcons[i]);
              }
              
              var fav = document.createElement('link');
              fav.rel = 'icon';
              fav.type = 'image/png';
              fav.href = pngUrl;
              document.head.appendChild(fav);
              
              var short = document.createElement('link');
              short.rel = 'shortcut icon';
              short.type = 'image/png';
              short.href = pngUrl;
              document.head.appendChild(short);
            };
            img.src = '/sahara-logo.jpg?v=' + Date.now();
          } catch (e) {}
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          renderLiveFavicon();
        } else {
          window.addEventListener('DOMContentLoaded', renderLiveFavicon);
        }
      })();
    </script>

    <!-- React DOM Reconciliation Safeguard for Real-Time Google/GTranslate Translation -->
    <script type="text/javascript">
      if (typeof Node === 'function' && Node.prototype) {
        var originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        var originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>
